  <svg class="logo" viewBox="0 0 96 96"><circle cx="48" cy="35" r="20" fill="none" stroke="currentColor" stroke-width="2"/><path d="M22 66 Q48 60 74 66" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".75"/><path d="M30 75 Q48 70 66 75" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".45"/><path d="M38 83 Q48 79 58 83" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity=".22"/></svg>
  <h1>名字的由来</h1>
  <p class="src">若 歇</p>

  <p>名字「若歇」取自《楞严经》：<strong>狂性自歇，歇即菩提。</strong></p>
  <p>经中讲，演若达多迷失本心，四处寻头，惶惶奔走，不知其头本在肩上。待狂念止息，方知其头本未曾失。</p>

  <div class="quote">愿她不逐虚妄，不困于纷扰，知所止，心自明。</div>

  <p>世人常向外求索认可、追逐虚妄纷扰，在喧嚣中迷失本心，在比较中心生躁动。</p>
  <p>人生虽有纷扰，愿她能够止息妄念，不被外境裹挟；不必向外寻找自己的价值，回归本心，便见清明。</p>

  <p class="wish">愿胡若歇这一生：<br>心有所止，行有所安，<br>本心自在，岁岁澄明。</p>
