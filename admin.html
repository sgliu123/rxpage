<script>
const API_BASE = 'https://rxapi.firstblade.site'; // ← 改成你的 Worker 域名
const SAYINGS = ['歇心一处，无事不办。','水止月现，念息心明。','不急不躁，慢慢长大。','记录的此刻，即是安住的此刻。','狂心顿歇，当下即是。','愿你慢慢长大，愿我们陪你一起，狂性自歇。'];
let token = localStorage.getItem('rx_token') || '';
let editingId = null;
let pickedFiles = [];      // 本次新选的待上传图片 {blob,name}
let existingMedia = [];    // 编辑时已有的图片/B站（全程累计保留，可删除其中项）
let existingVideos = [];   // 编辑时已有的视频 {type,key,url}
let videoPicked = [];      // 本次新选的待上传视频 {blob,name,note}
const DEFAULT_VHINT = '支持手机相机 mov / HEVC / mp4 / webm 等格式，自动转成通用可播放的 MP4';
const playItemOf = (blob, name, note) => ({ blob, name, note });
let biliItems = [];        // 当前B站链接列表 {bvid, url}
let allEntries = [];       // 缓存列表，供编辑载入
const $ = id => document.getElementById(id);

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2400);
}
function saying(){
  const s = SAYINGS[Math.floor(Math.random()*SAYINGS.length)];
  const el = $('saying'); el.textContent = s; el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'), 6000);
}
function authH(){ return { 'Authorization':'Bearer '+token }; }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- 登录 ---------- */
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  $('loginErr').textContent = '';
  const r = await fetch(API_BASE+'/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: $('pwd').value })
  });
  const d = await r.json();
  if(!r.ok){ $('loginErr').textContent = d.error || '登录失败'; return; }
  token = d.token; localStorage.setItem('rx_token', token);
  enter();
});
function logout(){ token=''; localStorage.removeItem('rx_token'); location.reload(); }
$('logout').addEventListener('click', logout);

function enter(){
  $('loginView').classList.add('hide');
  $('appView').classList.remove('hide');
  $('fDate').value = new Date().toISOString().slice(0,10);
  loadAdminList();
}
(async()=>{ // 自动尝试已有 token
  if(!token) return;
  const r = await fetch(API_BASE+'/api/entries?size=1', { headers: authH() });
  if(r.ok) enter();
})();

/* ---------- 图片本地压缩 ---------- */
async function compressImage(file){
  const bmp = await createImageBitmap(file);
  const MAX = 1200;
  const s = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * s)), h = Math.max(1, Math.round(bmp.height * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  let q = 0.85, blob = null;
  while (q >= 0.4){
    blob = await new Promise(r => c.toBlob(r, 'image/webp', q));
    if (blob && blob.size <= 200 * 1024) break;
    q -= 0.15;
  }
  if (!blob || blob.size > 500 * 1024) throw new Error('「'+file.name+'」压缩后仍过大，请换一张');
  return blob;
}

/* ---------- 缩略图渲染 ---------- */
function renderThumbs(){
  const bar = $('thumbBar'); bar.innerHTML = '';
  const all = [
    ...existingMedia.map((m, i)=>({ kind:'existing', ref:m, id:'ex'+i })),
    ...pickedFiles.map((f, i)=>({ kind:'picked', ref:f, id:'pk'+i }))
  ];
  all.forEach(item=>{
    const wrap = document.createElement('div');
    wrap.className = 'th-item' + (item.kind==='picked' ? ' is-new' : '');
    wrap.dataset.id = item.id; wrap.dataset.kind = item.kind;

    const img = document.createElement('img');
    img.src = item.kind==='picked' ? URL.createObjectURL(item.ref.blob) : API_BASE+item.ref.url;
    img.onclick = ()=>openImgModal(img.src);
    wrap.appendChild(img);

    const tag = document.createElement('span'); tag.className='tag';
    tag.textContent = item.ref.type==='video' ? '视频' : (item.ref.type==='bili' ? 'B站' : (item.kind==='picked'?'新':'原'));
    wrap.appendChild(tag);

    const del = document.createElement('button');
    del.className = 'del'; del.type='button'; del.textContent='✕';
    del.title = '删除这张';
    del.onclick = e=>{
      e.stopPropagation();
      if(item.kind==='picked'){
        pickedFiles = pickedFiles.filter(x=>x!==item.ref);
      } else {
        existingMedia = existingMedia.filter(x=>x!==item.ref);
      }
      renderThumbs();
      updateProg();
    };
    wrap.appendChild(del);
    bar.appendChild(wrap);
  });
  if(!all.length){ const e=document.createElement('span'); e.className='thv'; e.textContent='暂无媒体'; bar.appendChild(e); }
}

/* ---------- 视频缩略条（已有视频 + 本次新选） ---------- */
function renderVideoBar(){
  const bar = $('videoBar'); bar.innerHTML = '';
  const all = [
    ...existingVideos.map((m, i)=>({ kind:'existing', ref:m, id:'ev'+i })),
    ...videoPicked.map((f, i)=>({ kind:'picked', ref:f, id:'vp'+i }))
  ];
  all.forEach(item=>{
    const wrap = document.createElement('div');
    wrap.className = 'th-item' + (item.kind==='picked' ? ' is-new' : '');
    wrap.dataset.id = item.id; wrap.dataset.kind = item.kind;

    const v = document.createElement('video');
    v.src = item.kind==='picked' ? URL.createObjectURL(item.ref.blob) : API_BASE+item.ref.url;
    v.muted = true; v.playsInline = true; v.preload = 'metadata';
    v.controls = false;
    v.addEventListener('click', ()=>{ if(!v.paused) { v.pause(); v.currentTime = 0; } else v.play().catch(()=>{}); });
    v.title = item.kind==='picked' ? ('本次新增：'+item.ref.name+(item.ref.note?'（'+item.ref.note+'）':'')) : '已有视频';
    wrap.appendChild(v);

    const tag = document.createElement('span'); tag.className='tag';
    tag.textContent = item.kind==='picked'
      ? (item.ref.note ? ('新·'+item.ref.note) : '新增')
      : '视频';
    wrap.appendChild(tag);

    const del = document.createElement('button');
    del.className = 'del'; del.type='button'; del.textContent='✕';
    del.title = '删除这个视频';
    del.onclick = e=>{
      e.stopPropagation();
      if(item.kind==='picked') videoPicked = videoPicked.filter(x=>x!==item.ref);
      else existingVideos = existingVideos.filter(x=>x!==item.ref);
      v.removeAttribute('src'); v.load();
      renderVideoBar();
      updateProg();
    };
    wrap.appendChild(del);
    bar.appendChild(wrap);
  });
  if(!all.length){ const e=document.createElement('span'); e.className='thv'; e.textContent='暂无视频'; bar.appendChild(e); }
}

// 事件委托（兜底）
$('thumbBar').addEventListener('click', e=>{
  const del = e.target.closest('.del');
  if(!del) return;
  const item = del.closest('.th-item');
  if(!item) return;
  if(item.dataset.kind==='picked'){
    const idx = pickedFiles.findIndex((f,i)=>('pk'+i)===item.dataset.id);
    if(idx>=0) pickedFiles.splice(idx,1);
  } else {
    const idx = existingMedia.findIndex((m,i)=>('ex'+i)===item.dataset.id);
    if(idx>=0) existingMedia.splice(idx,1);
  }
  renderThumbs();
  updateProg();
});

function updateProg(){
  const imgKB = pickedFiles.reduce((a,b)=>a+b.blob.size,0);
  const vidMB = videoPicked.reduce((a,b)=>a+b.blob.size,0) / 1048576;
  const parts = [];
  if(pickedFiles.length) parts.push('照片 ×'+pickedFiles.length+'（约 '+Math.round(imgKB/1024)+' KB）');
  if(videoPicked.length) parts.push('视频 ×'+videoPicked.length+'（约 '+vidMB.toFixed(1)+' MB）');
  $('prog').textContent = parts.join(' · ');
}

$('fImgs').addEventListener('change', async e=>{
  const files = [...e.target.files];
  for (const f of files.slice(0, 30)){
    $('prog').textContent = '正在本地压缩 '+f.name+' …';
    try{
      const blob = await compressImage(f);
      pickedFiles.push({ blob, name: f.name });
    }catch(err){ toast(err.message); }
  }
  renderThumbs();
  updateProg();
  e.target.value = '';
});

/* ---------- 视频格式探测与本地转码（保证前端可播放） ----------
 * 手机相机常见的 .mov / HEVC 编码在 Chrome / 安卓 / 微信里都播不出画面，
 * 且部分 mp4 的 moov 在文件尾（配合不支持 Range 的服务器，iOS 也播不了）。
 * 所以选完视频先探测编码：
 *   1. 已是 H.264+AAC 的 mp4      → 原样保留
 *   2. 编码通用但 moov 在文件尾部 → 只重排封装（faststart，秒级、无损）
 *   3. 其他编码（HEVC/mpeg4/webm…）或非 mp4 容器 → ffmpeg.wasm 本地转码为 H.264 MP4
 */
const VIDEO_MAX_IN = 200 * 1024 * 1024;   // 输入上限
const VIDEO_MAX_OUT = 5 * 1024 * 1024;    // 落库上限（与原规则一致）
const PLAYABLE_VCODECS = new Set(['avc1', 'avc3']); // H.264
const FF_VER = '0.12.10', FF_CORE_VER = '0.12.6';
/* 引擎加载策略，按序尝试，全部失败则原样上传兜底：
 *  1. 同站 vendor 的 UMD 主类（同源 classic worker 最稳），core 从 CDN 下载
 *  2. CDN esm 类 + UMD worker + esm core（jsDelivr → unpkg，国内相对可达）
 * core+ wasm 约 31MB，成功后写入 Cache API，同一浏览器以后免下载 */
const FF_SOURCES = (function(){
  const same = (p)=>new URL(p, location.href).href;
  const core = (ver, sub)=>'https://registry.npmmirror.com/@ffmpeg/core@'+ver+'/files/dist/'+sub;
  /* 每 组候选 core 下载源（同站优先，外网全挂也能用） */
  const umdCores = [
    same('Vendor/core/'),                            // ≤25MB 分片托管，最稳
    core(FF_CORE_VER, 'umd/'),                       // 国内 npm 镜像
    'https://gcore.jsdelivr.net/npm/@ffmpeg/core@'+FF_CORE_VER+'/dist/umd/',
    'https://testingcf.jsdelivr.net/npm/@ffmpeg/core@'+FF_CORE_VER+'/dist/umd/',
    'https://unpkg.com/@ffmpeg/core@'+FF_CORE_VER+'/dist/umd/'
  ];
  const esmCores = [
    core(FF_CORE_VER, 'esm/'),
    'https://gcore.jsdelivr.net/npm/@ffmpeg/core@'+FF_CORE_VER+'/dist/esm/',
    'https://testingcf.jsdelivr.net/npm/@ffmpeg/core@'+FF_CORE_VER+'/dist/esm/',
    'https://unpkg.com/@ffmpeg/core@'+FF_CORE_VER+'/dist/esm/'
  ];
  return [
    { id:'本站+国内镜像', kind:'umd',
      // 文件夹大小写兼容：仓库里大写/小写都能命中
      scripts: [same('Vendor/ffmpege/ffmpeg.js'), same('vendor/ffmpege/ffmpeg.js')],
      coreBases: umdCores },
    { id:'npmmirror 全套', kind:'umd',
      scripts: ['https://registry.npmmirror.com/@ffmpeg/ffmpeg@'+FF_VER+'/files/dist/umd/ffmpeg.js'],
      coreBases: [core(FF_CORE_VER, 'umd/')] },
    { id:'jsDelivr 多节点', kind:'esm',
      esmBase: 'https://gcore.jsdelivr.net/npm/@ffmpeg/ffmpeg@'+FF_VER+'/dist/esm/',
      worker: 'https://gcore.jsdelivr.net/npm/@ffmpeg/ffmpeg@'+FF_VER+'/dist/umd/814.ffmpeg.js',
      coreBases: esmCores },
    { id:'unpkg', kind:'esm',
      esmBase: 'https://unpkg.com/@ffmpeg/ffmpeg@'+FF_VER+'/dist/esm/',
      worker: 'https://unpkg.com/@ffmpeg/ffmpeg@'+FF_VER+'/dist/umd/814.ffmpeg.js',
      coreBases: [core(FF_CORE_VER, 'esm/'), 'https://unpkg.com/@ffmpeg/core@'+FF_CORE_VER+'/dist/esm/'] },
  ];
})();
let ffmpegInst = null, ffmpegLoading = null;

/* 加载外部 <script>（失败不缓存，由调用方决定换源） */
function loadScript(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('script ' + url));
    document.head.appendChild(s);
  });
}

/* 大文件分块下载（Range + 单块重试）：弱网下比整段下载稳得多 */
async function fetchChunked(url){
  const CH = 4 * 1024 * 1024;
  const tryRange = (o)=>{
    const end = Math.min(o + CH, 1e15) - 1;
    return fetch(url, { headers:{ Range:'bytes='+o+'-'+end },
      signal: (typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?AbortSignal.timeout(60000):undefined });
  };
  const first = await tryRange(0);
  if(!first.ok || first.status !== 206) return null; // 源不支持 Range → 交给整段下载
  const total = parseInt((first.headers.get('content-range')||'').split('/')[1] || '0', 10);
  const parts = [ await first.arrayBuffer() ];
  let got = parts[0].byteLength;
  if(!total || got > total) return null;
  for(let off = got; off < total; off += CH){
    const r = await tryRange(off);
    if(!r.ok || r.status !== 206) throw new Error('分块 ' + off + ' 失败');
    const buf = await r.arrayBuffer();
    parts.push(buf); got += buf.byteLength;
  }
  if(got !== total) throw new Error('分块长度不符 ' + got + '/' + total);
  return new Blob(parts, { type: 'application/wasm' });
}

/* 分片文件下载（同名 .part00/part01… 拼接）：用于把大文件拆小后同站托管 */
async function fetchParts(url){
  const parts = [];
  for(let i = 0; i < 8; i++){
    const part = url + '.part' + String(i).padStart(2, '0');
    let r;
    try{ r = await fetch(part); }catch(e){ r = null; }
    if(!r || r.status === 404 || !r.ok){ if(i === 0) return null; break; }
    parts.push(await r.arrayBuffer());
  }
  if(parts.length === 0) return null;
  const total = parts.reduce((a,b)=>a+b.byteLength, 0);
  const out = new Uint8Array(total);
  let o = 0;
  for(const p of parts){ out.set(new Uint8Array(p), o); o += p.byteLength; }
  return out.buffer;
}

/* 下载并转 blob URL（Cache API 缓存；>1MB 优先分块/chunk，兜底分片拼接） */
async function fetchBlobURL(url, mime){
  const signal = (typeof AbortSignal !== 'undefined' && AbortSignal.timeout)
    ? AbortSignal.timeout(120000) : undefined;
  const cache = ('caches' in self) ? await caches.open('rx-ffmpeg-v1').catch(()=>null) : null;
  let blob = null;
  if(cache){
    const hit = await cache.match(url);
    if(hit) blob = await hit.blob();
  }
  if(!blob){
    let buf = null;
    if(url.endsWith('.wasm')){
      blob = await fetchChunked(url).catch(()=>null);
      if(!blob) buf = await fetchParts(url).catch(()=>null);
      if(buf) blob = new Blob([buf], { type: mime });
    }
    if(!blob){
      const r = await fetch(url, { signal });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      blob = await r.blob();
    }
    if(cache){ try{ await cache.put(url, new Response(blob, { status:200, statusText:'OK' })); }catch(e){} }
  }
  return URL.createObjectURL(new Blob([blob], { type: mime }));
}

/* CDN 的 esm 模块图很小（4 个文件）。
 * 动态 import 整图在弱网容易整体失败且不可重试，
 * 这里逐文件拉文本，内联拼成一个 blob module 再 import（每个文件可单独重试）。 */
const ESM_CACHE = {};
async function loadFFmpegModule(src, onStatus){
  if(ESM_CACHE[src.esmBase]) return ESM_CACHE[src.esmBase];
  const get = async (f)=>{
    let e;
    for(let i = 0; i < 3; i++){
      try{
        const r = await fetch(src.esmBase + f, {
          signal: AbortSignal.timeout ? AbortSignal.timeout(30000) : undefined });
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return await r.text();
      }catch(err){ e = err; await new Promise(res=>setTimeout(res, 800)); }
    }
    throw e;
  };
  const [konst, errors, utils, classes] = await Promise.all(
    ['const.js','errors.js','utils.js','classes.js'].map(get));
  const code = konst + '\n' + errors + '\n' + utils + '\n'
    + classes.replace(/^import[^\n]*;\s*$/gm, '');
  const url = URL.createObjectURL(new Blob([code], { type:'text/javascript' }));
  try{
    const mod = await import(url);
    ESM_CACHE[src.esmBase] = mod;
    return mod;
  }catch(err){
    URL.revokeObjectURL(url);
    throw err;
  }
}

async function loadFFmpeg(onStatus){
  if(ffmpegInst) return ffmpegInst;
  if(ffmpegLoading) return ffmpegLoading;
  /* 按 core 候选源逐个拉 core+wasm；某一候选成功就绪即用 */
  const fetchCorePair = async (bases, onStatus)=>{
    for(const base of bases){
      const b = base.endsWith('/') ? base : base + '/';
      try{
        const coreURL = await fetchBlobURL(b + 'ffmpeg-core.js', 'text/javascript');
        const wasmURL = await fetchBlobURL(b + 'ffmpeg-core.wasm', 'application/wasm');
        return { coreURL, wasmURL, from: b };
      }catch(e){ /* 换下一个候选源 */ }
    }
    throw new Error('core+wasm 所有候选源均下载失败');
  };
  ffmpegLoading = (async ()=>{
    let lastErr = new Error('没有可用的转码引擎来源');
    for(const src of FF_SOURCES){
      try{
        let FF, config;
        if(src.kind === 'umd'){
          onStatus && onStatus('加载本地转码引擎（' + src.id + '）…');
          let mounted = false;
          for(const s0 of src.scripts){
            try{
              await loadScript(s0);
              if(window.FFmpegWASM && window.FFmpegWASM.FFmpeg){ mounted = true; break; }
            }catch(e){ /* 404 换大小写变体重试 */ }
          }
          FF = mounted ? (window.FFmpegWASM && window.FFmpegWASM.FFmpeg) : null;
          if(!FF) throw new Error('UMD 主类未挂载');
          // UMD 主类会自动用同目录的 814.ffmpeg.js 起 classic worker，core 走 importScripts（UMD core）
          const pair = await fetchCorePair(src.coreBases, onStatus);
          config = { coreURL: pair.coreURL, wasmURL: pair.wasmURL };
        }else{
          onStatus && onStatus('加载本地转码引擎（' + src.id + '）…');
          ({ FFmpeg: FF } = await loadFFmpegModule(src, onStatus));
          // esm 类以 module worker 启动：UMD 814 里 importScripts 会抛错并回退 dynamic import，
          // 动态导入模式下必须用 esm 版 core（有 default export）
          const pair = await fetchCorePair(src.coreBases, onStatus);
          const classWorkerURL = await fetchBlobURL(src.worker, 'text/javascript');
          config = { coreURL: pair.coreURL, wasmURL: pair.wasmURL, classWorkerURL };
        }
        const ff = new FF();
        ff.on('progress', ({ progress })=>{
          if(onStatus && progress > 0 && progress <= 1)
            onStatus('转码中 ' + Math.round(progress * 100) + '% …');
        });
        await ff.load(config);
        ffmpegInst = ff;
        return ff;
      }catch(err){
        lastErr = err;
        onStatus && onStatus('引擎源 '+src.id+' 不可用，切换下一个…');
      }
    }
    throw lastErr;
  })();
  try{ return await ffmpegLoading; }
  catch(err){ ffmpegLoading = null; throw err; }
}

/* 读完文件并解析 MP4 box：返回编解码器与 moov 位置 */
async function probeMp4Codec(file){
  const buf = await file.arrayBuffer();
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  const tag4 = (o)=>String.fromCharCode(u8[o],u8[o+1],u8[o+2],u8[o+3]);
  let mdatOff = Infinity, moovOff = Infinity;
  const codecs = { v: [], a: [] };
  const walk = (off, end, inStsd)=>{
    while(off + 8 <= end){
      let size = dv.getUint32(off);
      const typ = tag4(off + 4);
      if(size === 1){ // 64bit 长度
        if(off + 16 > end) return;
        size = Number(dv.getBigUint64(off + 8));
        if(size < 16) return;
      }else if(size === 0){
        size = end - off;
      }
      if(size < 8 || off + size > end) return;
      if(typ === 'mdat') mdatOff = Math.min(mdatOff, off);
      if(typ === 'moov') moovOff = Math.min(moovOff, off);
      if(typ === 'stsd' && !inStsd){
        walk(off + 16, off + size, true);           // 跳过 version/flags + entry_count
      }else if(!inStsd && ['moov','trak','mdia','minf','stbl'].includes(typ)){
        walk(off + 8, off + size, false);
      }else if(inStsd){
        if(['avc1','avc3','hvc1','hev1','mp4v','av01','vp09','vp08'].includes(typ)) codecs.v.push(typ);
        if(['mp4a','opus','Opus','ac-3','ec-3','fLaC','alac','sowt','twos'].includes(typ)) codecs.a.push(typ);
      }
      off += size;
    }
  };
  walk(0, buf.byteLength, false);
  return {
    vcodec: codecs.v[0] || null,
    acodec: codecs.a[0] || null,
    hasVideo: codecs.v.length > 0,
    moovFirst: moovOff < mdatOff
  };
}

/* H.264/AAC 但 moov 在尾部 → 只重排封装成 faststart（无损、秒级） */
async function remuxFaststart(file, onStatus){
  const ff = await loadFFmpeg(onStatus);
  onStatus && onStatus('重排封装（faststart）…');
  await ff.writeFile('in.mp4', await file.arrayBuffer());
  try{
    await ff.exec(['-y','-i','in.mp4','-c','copy','-movflags','+faststart','-f','mp4','out.mp4']);
    const out = await ff.readFile('out.mp4');
    if(!out || !out.length) throw new Error('重排输出为空');
    return playItemOf(new Blob([out.buffer], { type:'video/mp4' }),
      (file.name.replace(/\.[^.]+$/, '') || 'video') + '.mp4', 'faststart');
  }finally{
    ff.deleteFile('in.mp4').catch(()=>{});
    ff.deleteFile('out.mp4').catch(()=>{});
  }
}

/* 统一入口：把任意本地视频处理为可播放的 MP4；引擎不可用时原样上传兜底 */
async function ensurePlayableMp4(file, onStatus){
  const name = file.name || 'video';
  const ext = (name.split('.').pop() || '').toLowerCase();
  if(file.size > VIDEO_MAX_IN) throw new Error('太大（>200MB），请先在系统相册里裁剪或压缩');

  let info = null;
  if(/^\.(mp4|m4v|mov)$/.test('.' + ext) && file.size <= VIDEO_MAX_IN * 2){
    try{ info = await probeMp4Codec(file); }catch(e){ info = null; }
    if(info && info.vcodec && PLAYABLE_VCODECS.has(info.vcodec)
        && (!info.acodec || info.acodec === 'mp4a' || info.acodec === 'Opus' || info.acodec === 'opus')
        && info.hasVideo){
      try{ return await remuxFaststart(file, onStatus); }
      catch(e){ try{ return await transcodeToMp4(file, onStatus); }
                catch(e2){ return fallbackKeep(file, onStatus, '转码失败，原样上传(' + (e2 && e2.message || '未知') + ')'); } }
    }
  }
  try{ return await transcodeToMp4(file, onStatus); }
  catch(e){
    // 引擎加载失败（弱网/CDN 不通）：原样上传，至少不丢内容
    return fallbackKeep(file, onStatus, '转码引擎不可用(' + (e && e.message || '未知') + ')');
  }
}

function fallbackKeep(file, onStatus, reason){
  onStatus && onStatus('');
  toast('「'+file.name+'」' + reason + '，部分设备可能无法播放');
  return playItemOf(file, file.name, '原样');
}

/* ffmpeg.wasm 转码：H.264 Main + AAC + faststart，超过 5MB 自动加重压缩 */
async function transcodeToMp4(file, onStatus){
  const ff = await loadFFmpeg(onStatus);
  const baseName = file.name.replace(/\.[^.]+$/, '') || 'video';
  onStatus && onStatus('准备转码（约 ' + (file.size/1024/1024).toFixed(1) + ' MB）…');
  await ff.writeFile('in.src', await file.arrayBuffer());
  const crfs = [26, 30, 34, 38];
  const scales = ["scale=min(1280\\,iw):-2", "scale=min(960\\,iw):-2"];
  let outBytes = null;
  for(const scale of scales){
    for(const crf of crfs){
      onStatus && onStatus('转码中（压到 ≤5MB）…');
      await ff.exec([
        '-y',
        '-i','in.src',
        '-c:v','libx264','-profile:v','main','-preset','veryfast','-crf',String(crf),
        '-vf', scale, '-pix_fmt','yuv420p','-r','30',
        '-c:a','aac','-b:a','96k','-ac','2','-ar','44100',
        '-movflags','+faststart','-f','mp4','out.mp4'
      ]);
      const data = await ff.readFile('out.mp4');
      if(!data || !data.length) throw new Error('转码输出为空');
      if(data.length <= VIDEO_MAX_OUT){ outBytes = data; break; }
      await ff.deleteFile('out.mp4');
    }
    if(outBytes) break;
  }
  ff.deleteFile('in.src').catch(()=>{});
  ff.deleteFile('out.mp4').catch(()=>{});
  if(!outBytes) throw new Error('压缩到 5MB 内仍失败，请裁短一点再传');
  return playItemOf(new Blob([outBytes.buffer], { type:'video/mp4' }), baseName + '.mp4', 'H.264');
}

/* ---------- 本地视频多选/追加/删除 ---------- */
$('fVideo').addEventListener('change', async e=>{
  const files = [...e.target.files];
  e.target.value = '';
  if(!files.length) return;
  $('videoBtn').classList.add('disabled');
  let ok = 0, fail = 0;
  for(const f of files.slice(0, 10)){
    try{
      const item = await ensurePlayableMp4(f, (msg)=>{ $('vHint').textContent = '「'+f.name+'」'+msg; });
      videoPicked.push(item);
      ok++;
      $('vHint').textContent = DEFAULT_VHINT;
    }catch(err){
      fail++;
      toast('「'+ (f.name||'视频') +'」'+ (err && err.message ? err.message : '处理失败'));
    }
  }
  $('videoBtn').classList.remove('disabled');
  if(fail) $('vHint').textContent = (ok ? ('已添加 '+ok+' 段，') : '') + fail + ' 段添加失败';
  renderVideoBar();
  updateProg();
});

/* ---------- B站多链接管理 ---------- */
function normalizeBiliLink(raw){
  if(!raw) return null;
  raw = raw.trim();
  const m = raw.match(/BV[a-zA-Z0-9]+/);
  if(!m) return null;
  return { bvid: m[0], url: raw };
}

function renderBiliTags(){
  const container = $('biliTags');
  container.innerHTML = '';
  biliItems.forEach((item, idx)=>{
    const tag = document.createElement('span');
    tag.className = 'bili-tag';
    tag.innerHTML = `${esc(item.bvid)} <button type="button" class="del-bili" data-idx="${idx}">✕</button>`;
    container.appendChild(tag);
  });
  // 删除按钮事件（直接用事件委托也可以，这里直接绑定）
  container.querySelectorAll('.del-bili').forEach(btn=>{
    btn.addEventListener('click', function(){
      const idx = parseInt(this.dataset.idx);
      biliItems.splice(idx, 1);
      renderBiliTags();
    });
  });
}

function addBiliFromInput(){
  const inp = $('biliInput');
  const raw = inp.value.trim();
  if(!raw) return;
  const norm = normalizeBiliLink(raw);
  if(!norm){ toast('无法识别B站链接，请包含BV号'); return; }
  // 去重（按bvid）
  if(biliItems.some(x=>x.bvid===norm.bvid)){ toast('该B站视频已添加'); inp.value=''; return; }
  biliItems.push(norm);
  inp.value = '';
  renderBiliTags();
}

$('biliAddBtn').addEventListener('click', addBiliFromInput);
$('biliInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); addBiliFromInput(); }
});

/* ---------- 上传与保存 ---------- */
async function uploadBlob(blob, ext){
  const r = await fetch(API_BASE+'/api/upload', {
    method:'POST', headers:{ ...authH(), 'Content-Type':'application/octet-stream', 'X-File-Ext': ext },
    body: blob
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error || '上传失败');
  return d;
}

function getBiliPayload(){
  return biliItems.map(item=>({ type:'bili', bvid: item.bvid }));
}

$('entryForm').addEventListener('submit', async e=>{
  e.preventDefault();
  if(editingId === null && !pickedFiles.length && !videoPicked.length && !biliItems.length && !$('fContent').value.trim()){
    toast('请至少填写内容、选择照片或添加链接'); return;
  }
  $('saveBtn').disabled = true;
  try{
    const media = [];
    // 编辑时：保留未被删除的原有媒体（图片/视频/B站），再追加本次新上传的
    if(editingId){
      existingMedia.forEach(m=>{ if(m.type==='image') media.push({ type:m.type, key:m.key }); });
      existingVideos.forEach(m=>{ media.push({ type:'video', key:m.key }); });
    }
    for (let i=0; i<pickedFiles.length; i++){
      $('prog').textContent = '上传照片 '+(i+1)+'/'+pickedFiles.length+' …';
      const d = await uploadBlob(pickedFiles[i].blob, 'webp');
      media.push({ type:'image', key:d.key });
    }
    for (let i=0; i<videoPicked.length; i++){
      $('prog').textContent = '上传视频 '+(i+1)+'/'+videoPicked.length+' …';
      const item = videoPicked[i];
      const ext = (item.note === '原样' && /\.[a-z0-9]{1,5}$/i.test(item.name || ''))
        ? (item.name.split('.').pop() || 'mp4').toLowerCase() : 'mp4';
      const d = await uploadBlob(item.blob, ext);
      media.push({ type:'video', key:d.key });
    }
    media.push(...getBiliPayload());

    const payload = {
      title: $('fTitle').value, event_date: $('fDate').value,
      content: $('fContent').value, media
    };
    $('prog').textContent = '写入数据库 …';
    const url = editingId ? API_BASE+'/api/entries/'+editingId : API_BASE+'/api/entries';
    const r = await fetch(url, { method: editingId?'PUT':'POST', headers:{...authH(),'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || '保存失败');

    $('prog').textContent = '已保存 ✓';
    toast(editingId ? '已更新' : '已保存');
    saying();
    resetForm();
    loadAdminList();
  }catch(err){ toast(err.message); $('prog').textContent=''; }
  $('saveBtn').disabled = false;
});

function resetForm(){
  editingId = null; pickedFiles = []; existingMedia = [];
  existingVideos = []; videoPicked = [];
  biliItems = [];
  $('fTitle').value=''; $('fContent').value=''; $('biliInput').value='';
  $('fImgs').value=''; $('fVideo').value='';
  $('vHint').textContent = DEFAULT_VHINT;
  $('thumbBar').innerHTML=''; $('videoBar').innerHTML=''; $('biliTags').innerHTML=''; $('prog').textContent='';
  $('saveBtn').textContent = '保 存 这 一 刻';
  $('fDate').value = new Date().toISOString().slice(0,10);
}

/* ---------- 条目管理 ---------- */
async function loadAdminList(){
  const r = await fetch(API_BASE+'/api/entries?size=100', { headers: authH() });
  if(r.status === 401){ logout(); return; }
  const d = await r.json();
  const box = $('adminList');
  allEntries = d.list || [];
  if(!allEntries.length){ box.innerHTML = '<div class="empty">暂无记录</div>'; return; }
  box.innerHTML = allEntries.map(e=>{
    const imgs = e.media.filter(m=>m.type==='image').slice(0,3);
    const vcnt = e.media.filter(m=>m.type==='video').length;
    const extra = e.media.length - imgs.length;
    return `<div class="item">
      <div class="info">
        <div class="t1">${esc(e.title)}</div>
        <div class="t2">${e.event_date} · ${e.media.length} 个媒体${vcnt?` · 视频×${vcnt}`:''}</div>
      </div>
      <div class="thumbs">${imgs.map(m=>`<img src="${API_BASE}${m.url}" loading="lazy">`).join('')}${extra>0?`<span class="t2">+${extra}</span>`:''}</div>
      <button data-edit="${e.id}">编辑</button>
      <button class="danger" data-del="${e.id}" data-title="${esc(e.title)}">删除</button>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('确定删除「'+b.dataset.title+'」？关联图片将一并清除。')) return;
    const r = await fetch(API_BASE+'/api/entries/'+b.dataset.del, { method:'DELETE', headers: authH() });
    if(r.ok){ toast('已删除'); loadAdminList(); } else toast('删除失败');
  }));
  box.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
    const entry = allEntries.find(x=>String(x.id)===String(b.dataset.edit));
    if(entry) loadForEdit(entry);
  }));
}

function loadForEdit(e){
  editingId = e.id;
  $('fTitle').value = e.title; $('fDate').value = e.event_date; $('fContent').value = e.content || '';
  // 从media中提取B站链接
  biliItems = (e.media||[]).filter(m=>m.type==='bili').map(m=>({ bvid: m.bvid, url: 'https://www.bilibili.com/video/'+m.bvid }));
  renderBiliTags();
  pickedFiles = []; videoPicked = []; $('fImgs').value=''; $('fVideo').value='';
  $('vHint').textContent = DEFAULT_VHINT;

  existingMedia = (e.media||[]).filter(m=>m.type==='image').map(m=>({
    type: m.type, key: m.key, url: m.url, bvid: m.bvid
  }));
  // 编辑时载入已有视频（此次不再被静默丢弃）
  existingVideos = (e.media||[]).filter(m=>m.type==='video').map(m=>({
    type: 'video', key: m.key, url: m.url
  }));
  renderThumbs();
  renderVideoBar();

  window.scrollTo({top:0, behavior:'smooth'});
  $('saveBtn').textContent = '更 新 这 一 刻';
  toast('已载入编辑：媒体累计保留，可删除或继续添加');
}

/* ---------- 导出备份 ---------- */
async function doExport(kind){
  const r = await fetch(API_BASE+'/api/export', { headers: authH() });
  if(!r.ok){ toast('导出失败，请重新登录'); return; }
  const d = await r.json();
  const stamp = new Date().toISOString().slice(0,10);
  if(kind==='json') download('成长足迹备份-'+stamp+'.json', JSON.stringify(d.json, null, 2), 'application/json');
  else download('成长足迹备份-'+stamp+'.md', d.markdown, 'text/markdown');
  toast('已导出 '+d.count+' 条记录');
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
$('expJson').addEventListener('click', ()=>doExport('json'));
$('expMd').addEventListener('click', ()=>doExport('md'));
</script>
